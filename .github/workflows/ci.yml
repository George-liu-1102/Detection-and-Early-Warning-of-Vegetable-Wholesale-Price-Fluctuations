name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt -r requirements-notebook.txt

      - name: Run unit tests
        run: python -m pytest tests -q

      - name: Smoke run monitor pipeline
        run: python scripts/run_veg_monitor.py --generate-report --top-k 5 --notify-dry-run --out-dir /tmp/veg-monitor

      - name: Evaluate thresholds and verify SQL consistency
        run: |
          python scripts/evaluate_monitor.py --out-dir /tmp/veg-monitor
          python scripts/run_sql_analysis.py --out-dir /tmp/veg-monitor

      - name: Execute analysis notebook
        run: jupyter nbconvert --to notebook --execute notebooks/eda.ipynb --output executed.ipynb --output-dir /tmp --ExecutePreprocessor.timeout=180
